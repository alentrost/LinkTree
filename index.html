<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#dcebe2" />
  <title>Alen Trošt | Links</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      color-scheme: light;
      --ink: #173d32;
      --paper: #f7faf4;
      --field: #dcebe2;
      --line: #c8d9ce;
      --muted: #637a6f;
      --lime: #d5f36a;
      --orange: #ff764b;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--ink);
      background-color: var(--field);
      background-image: radial-gradient(#aac4b3 0.8px, transparent 0.8px);
      background-size: 18px 18px;
      font-family: 'DM Sans', sans-serif;
    }

    .profile {
      width: min(100%, 560px);
      overflow: hidden;
      border: 1px solid var(--ink);
      background: var(--paper);
      box-shadow: 9px 9px 0 var(--ink);
      animation: arrive 500ms ease-out both;
    }

    .topline {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .topline-mark { display: flex; align-items: center; gap: 8px; }
    .topline-mark::before { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); content: ''; }

    .intro { padding: 35px 30px 27px; }

    .identity { display: flex; align-items: center; gap: 19px; }

    .monogram {
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      display: grid;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 50%;
      background: var(--lime);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 34px;
      font-weight: 700;
      transform: rotate(-7deg);
    }

    h1 {
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(30px, 8vw, 42px);
      line-height: 1;
    }

    .handle { margin: 7px 0 0; color: var(--muted); font-size: 14px; }

    .intro-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 26px;
    }

    .intro-bottom p { margin: 0; font-size: 15px; font-weight: 600; }

    .count {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .links { display: grid; gap: 10px; padding: 0 20px 20px; }

    .link {
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: #fff;
      text-decoration: none;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .link:hover {
      z-index: 1;
      border-color: var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      transform: translate(-2px, -2px);
    }

    .link:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

    .icon {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
    }

    .icon svg { width: 24px; height: 24px; }
    .snapchat .icon { background: #ffef55; color: #171717; }
    .instagram .icon { background: #f9d8cc; color: #a34167; }
    .tiktok .icon { background: #d3eff0; color: #111; }
    .facebook .icon { background: #d9e6ff; color: #1769e0; }
    .leetcode .icon { background: #ffdfc4; color: #bd5b16; }

    .link-copy { min-width: 0; flex: 1; }
    .label { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; }
    .small { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }

    .arrow { width: 20px; height: 20px; flex: 0 0 20px; color: var(--muted); transition: transform 160ms ease; }
    .link:hover .arrow { color: var(--ink); transform: translate(2px, -2px); }

    footer {
      display: flex;
      justify-content: space-between;
      padding: 15px 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    @keyframes arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 420px) {
      body { padding: 20px 14px; }
      .profile { box-shadow: 5px 5px 0 var(--ink); }
      .topline { padding: 0 18px; }
      .intro { padding: 28px 20px 22px; }
      .monogram { width: 64px; height: 64px; flex-basis: 64px; font-size: 29px; }
      .links { gap: 8px; padding: 0 12px 14px; }
      .link { min-height: 70px; gap: 11px; padding: 9px 10px; }
      .icon { width: 44px; height: 44px; flex-basis: 44px; }
      footer { padding-right: 18px; padding-left: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
